<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zero RIR</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zero RIR">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #0f1115; --card: #181b21; --card2: #20242c; --line: #2a2f38;
  --text: #eef0f3; --muted: #9aa1ad; --faint: #6b7280;
  --accent: #c6f432; --accent-ink: #1a2200;
  --up: #4ade80; --up-bg: rgba(74,222,128,.12);
  --warn: #fbbf24; --warn-bg: rgba(251,191,36,.12);
  --bad: #f87171; --bad-bg: rgba(248,113,113,.12);
  --info: #60a5fa; --info-bg: rgba(96,165,250,.12);
  --r: 14px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f7; --card: #ffffff; --card2: #f0f1f4; --line: #e3e5ea;
    --text: #12151a; --muted: #5b6270; --faint: #8a909c;
    --accent: #4d7c0f; --accent-ink: #ffffff;
    --up: #15803d; --up-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --info: #1d4ed8; --info-bg: #dbeafe;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(12px + env(safe-area-inset-top)) 0 10px; border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -.5px; }
header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 650; }
@media (max-width: 370px) { header .logo { display: none; } header h1 { visibility: hidden; } header .wrap { gap: 6px; } .hevybtn { padding: 0 10px; } }
.iconbtn { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
.iconbtn:active { transform: scale(.97); }
.hevybtn { height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; border-radius: 10px; }
.hevybtn:active { transform: scale(.97); }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hevy-result { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 25; max-width: 608px; margin: 0 auto;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: none; }
.hevy-result.on { display: block; }
.hevy-result b { display: block; margin-bottom: 4px; }
.hevy-result p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.hevy-result .warn { color: var(--warn); }

nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav .wrap { display: grid; grid-template-columns: repeat(6, 1fr); padding: 0 2px; }
nav button { background: none; border: 0; padding: 9px 0 8px; display: flex; flex-direction: column;
  align-items: center; gap: 3px; font-size: 11px; color: var(--faint); cursor: pointer; }
nav button svg { width: 22px; height: 22px; }
nav button.on { color: var(--accent); }

main { padding-top: 16px; }
.view { display: none; } .view.on { display: block; }
.hero { margin: 4px 0 16px; }
.eyebrow { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.hero h2 { font-size: 30px; line-height: 1.1; margin: 4px 0 6px; font-weight: 750; letter-spacing: -.02em; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
  padding: 3px 9px; border-radius: 999px; background: var(--card2); color: var(--muted); }
.pill.today { background: var(--accent); color: var(--accent-ink); }
.pill.up { background: var(--up-bg); color: var(--up); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }

.banner { background: var(--up-bg); color: var(--up); border-radius: var(--r); padding: 12px 14px;
  margin-bottom: 14px; font-size: 14px; }
.banner b { display: block; margin-bottom: 2px; }

.ex { background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px; margin-bottom: 12px; }
.ex.inc { border-color: color-mix(in srgb, var(--up) 45%, var(--line)); }
.ex-top { display: flex; align-items: flex-start; gap: 10px; }
.ex-num { width: 24px; height: 24px; border-radius: 7px; background: var(--card2); color: var(--muted);
  font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; margin-top: 2px; }
.ex-name { flex: 1; font-weight: 650; font-size: 16px; min-width: 0; }
.ex-target { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 8px; flex-wrap: wrap; }
.big { font-size: 30px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big small { font-size: 16px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.x { color: var(--faint); font-size: 18px; }
.reason { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.ex-foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line);
  padding-top: 10px; margin-top: 4px; font-size: 12px; color: var(--faint); }
.ex-foot .grow { flex: 1; min-width: 0; }
.link { background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 2px; }
.swap { margin-top: 10px; display: flex; gap: 8px; }
.swap select { flex: 1; min-width: 0; }
.swapped { margin-top: 10px; background: var(--card2); border-radius: 10px; padding: 10px 12px; }

select, input[type=number], input[type=password], input[type=text] {
  background: var(--card2); border: 1px solid var(--line); border-radius: 10px; height: 40px; padding: 0 10px; width: 100%; }
select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; height: 40px;
  padding: 0 16px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: var(--card2); color: var(--text); border: 1px solid var(--line); }
.btn:disabled { opacity: .6; }

.segs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
.segs::-webkit-scrollbar { display: none; }
.seg { flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 14px; font-size: 14px; cursor: pointer; }
.seg.on { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }

.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.metric { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.metric span { display: block; font-size: 12px; color: var(--muted); }
.metric b { font-size: 20px; font-variant-numeric: tabular-nums; }
.chart { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 8px 6px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart-head { display: flex; justify-content: space-between; align-items: center; padding: 0 6px 6px; font-size: 13px; color: var(--muted); }
.range { display: flex; gap: 4px; }
.range button { background: none; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; padding: 2px 8px; cursor: pointer; color: var(--muted); }
.range button.on { background: var(--card2); color: var(--text); }
table.log { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 14px; font-variant-numeric: tabular-nums; }
table.log th { text-align: left; color: var(--faint); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.log td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.log td.sets { font-family: var(--mono); font-size: 12.5px; }
.tablewrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 10px; margin-top: 14px; overflow-x: auto; }
.tablewrap table.log { margin: 0; }

.week { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; font-size: 15px; }
.week p { margin: 0 0 6px; } .week .gap { height: 10px; }
.week em { color: var(--muted); font-style: normal; font-size: 13px; }

.setrow { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
.setrow-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; font-size: 15px; }
.setrow-head > span:first-child { flex: 1; min-width: 0; }
.setgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.setgrid label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
.setgrid input.changed { border-color: var(--accent); }
.search { margin-bottom: 12px; }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: none; align-items: flex-end; }
.sheet-bg.on { display: flex; }
.sheet { background: var(--card); width: 100%; max-width: 640px; margin: 0 auto; border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet h3 { margin: 0 0 4px; font-size: 18px; }
.sheet p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.sheet .row { display: flex; gap: 8px; margin-bottom: 8px; }
.sheet .row .btn { flex: 1; }
pre.joblog { background: var(--card2); border-radius: 10px; padding: 10px; font-size: 12px; max-height: 40vh;
  overflow: auto; white-space: pre-wrap; margin: 10px 0 0; display: none; }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 30;
  opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; }
.skel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); height: 150px; margin-bottom: 12px;
  animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.err { background: var(--bad-bg); color: var(--bad); border-radius: var(--r); padding: 14px; font-size: 14px; }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }

.g-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
.g-card h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

/* ---------- Coach ---------- */
.chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; }
.msg.model { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg.model p { margin: 0 0 6px; } .msg.model p:last-child { margin: 0; }
.msg.model ul { margin: 4px 0 6px; padding-left: 18px; } .msg.model li { margin: 2px 0; }
.msg.err { align-self: flex-start; background: var(--bad-bg); color: var(--bad); }
.typing { align-self: flex-start; color: var(--muted); font-size: 14px; padding: 4px 6px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: 13.5px; cursor: pointer; text-align: left; }
.composer { position: sticky; bottom: calc(66px + env(safe-area-inset-bottom)); background: var(--bg); padding: 10px 0 8px; display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; background: var(--card2); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; max-height: 140px; min-height: 44px; line-height: 1.4; font: inherit; color: inherit; }
.composer textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
.composer .btn { height: 44px; }
.coach-intro { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.setup ol { padding-left: 20px; margin: 8px 0; } .setup li { margin: 6px 0; }
.setup code { background: var(--card2); padding: 2px 6px; border-radius: 6px; font-family: var(--mono); font-size: 13px; }

#pin { position: fixed; inset: 0; background: var(--bg); z-index: 40; display: none; place-items: center; padding: 16px; }
#pin.on { display: grid; }
#pin form { width: 100%; max-width: 320px; text-align: center; }
#pin input { text-align: center; font-size: 24px; height: 52px; letter-spacing: .3em; margin: 16px 0 10px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">0R</div>
    <h1 id="title">Today</h1>
    <button class="iconbtn" id="refresh" aria-label="Refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button class="iconbtn" id="openTools" aria-label="More: sync, retrain, preview">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <button class="btn hevybtn" id="sendHevy">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span>Send to Hevy</span>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-plan">
    <div class="segs" id="planSegs"></div>
    <div id="planBody"></div>
  </section>
  <section class="view" id="v-stats">
    <select id="statsPick" aria-label="Exercise"></select>
    <div id="statsBody"></div>
  </section>
  <section class="view" id="v-week"></section>
  <section class="view" id="v-coach"></section>
  <section class="view" id="v-settings">
    <input type="text" class="search" id="setSearch" placeholder="Filter exercises" aria-label="Filter exercises">
    <div id="setBody"></div>
  </section>
</main>

<nav>
  <div class="wrap">
    <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Today</button>
    <button data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg>All days</button>
    <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19h16M7 15l4-5 3 3 5-7"/></svg>Stats</button>
    <button data-v="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Week</button>
    <button data-v="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>Coach</button>
    <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
  </div>
</nav>

<div class="sheet-bg" id="tools">
  <div class="sheet">
    <h3>More</h3>
    <p>Sync pulls your latest workouts from Hevy, then writes the new targets into your Hevy routines. That also happens by itself after each workout and when you change a setting.</p>
    <div class="row">
      <button class="btn" id="doSync">Sync from Hevy</button>
      <button class="btn ghost" id="doTrain">Retrain models</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="doPreview" style="flex:1">Preview Hevy changes (writes nothing)</button>
    </div>
    <button class="btn ghost" style="width:100%" id="closeTools">Close</button>
    <pre class="joblog" id="jobLog"></pre>
  </div>
</div>

<div id="pin">
  <form id="pinForm">
    <div class="logo" style="margin:0 auto;width:48px;height:48px;font-size:18px;border-radius:12px">0R</div>
    <input type="password" inputmode="numeric" id="pinInput" placeholder="PIN" autocomplete="current-password" aria-label="PIN">
    <div id="pinErr" style="color:var(--bad);font-size:13px;min-height:18px"></div>
    <button class="btn" style="width:100%">Unlock</button>
  </form>
</div>

<div class="hevy-result" id="hevyResult" role="status"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n == null ? "–" : (Math.round(n * 100) / 100).toString());
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const loadJSON = (k, d) => { try { return JSON.parse(store.get(k)) ?? d; } catch { return d; } };
const saveJSON = (k, v) => store.set(k, JSON.stringify(v));
let pin = store.get("zr_pin") || "";
let exercises = [];
const cache = {};

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2600);
}

async function api(path, body) {
  const opts = { headers: { "X-Pin": pin } };
  if (body !== undefined) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch("/api/" + path, opts);
  const data = await res.json().catch(() => ({ error: "The server sent a bad reply." }));
  if (res.status === 401 && data.pin_required) { showPin(); throw new Error("PIN needed"); }
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

/* ---------- PIN ---------- */
function showPin(msg) { $("#pin").classList.add("on"); $("#pinErr").textContent = msg || ""; setTimeout(() => $("#pinInput").focus(), 50); }
$("#pinForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("#pinInput").value.trim();
  if (!v) { $("#pinErr").textContent = "Enter your PIN first."; return; }
  pin = v;
  try { await api("exercises"); store.set("zr_pin", pin); $("#pin").classList.remove("on"); boot(); }
  catch { showPin("That PIN didn't work."); }
});
$("#pinInput").addEventListener("input", () => $("#pinErr").textContent = "");

/* ---------- Navigation ---------- */
const TITLES = { today: "Today", plan: "All days", stats: "Stats", week: "This week", coach: "Coach", settings: "Settings" };
let current = "today";
function go(v) {
  current = v;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  $("#title").textContent = TITLES[v];
  store.set("zr_view", v);
  load(v);
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.v)));
$("#refresh").addEventListener("click", () => { delete cache[current]; load(current, true); toast("Refreshed"); });

function loading(el, n = 3) { el.innerHTML = '<div class="skel"></div>'.repeat(n); }
function fail(el, e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }

function load(v, force) {
  if (v === "today") loadToday(force);
  if (v === "plan") loadPlan(force);
  if (v === "stats") loadStats();
  if (v === "week") loadWeek(force);
  if (v === "settings") loadSettings(force);
  if (v === "coach") loadCoach();
}

/* ---------- Exercise card ---------- */
const cleanLead = s => String(s || "").replace(/[\p{Extended_Pictographic}\uFE0F\u2190-\u21FF\u2B00-\u2BFF]/gu, "").replace(/\s*\|\s*/g, " · ").trim();
function tagClass(t) {
  if (/plateau|regression/i.test(t)) return "bad";
  if (/momentum|load increased/i.test(t)) return "up";
  if (/max|maxed/i.test(t)) return "info";
  return "";
}
function targetBlock(t) {
  const tags = t.tags.map(x => `<span class="pill ${tagClass(x)}">${esc(cleanLead(x))}</span>`).join("");
  return `
    <div class="ex-target">
      <span class="big">${fmt(t.weight)}<small>kg</small></span>
      <span class="x">×</span><span class="big">${esc(t.reps)}<small>reps</small></span>
      <span class="x">×</span><span class="big">${t.sets}<small>sets</small></span>
    </div>
    <p class="reason">${esc(cleanLead(t.reason))}</p>
    ${tags ? `<div class="tags">${tags}</div>` : ""}`;
}
function exCard(t, i) {
  const ml = t.ml ? ` · ${esc(cleanLead(t.ml))}` : "";
  return `
  <div class="ex ${t.increase ? "inc" : ""}" data-ex="${esc(t.exercise)}">
    <div class="ex-top">
      <span class="ex-num">${i + 1}</span>
      <span class="ex-name">${esc(t.exercise)}</span>
      ${t.increase ? '<span class="pill up">Weight up</span>' : ""}
    </div>
    ${targetBlock(t)}
    <div class="ex-foot">
      <span class="grow">${esc(cleanLead(t.trend))}${ml}</span>
      <button class="link" data-act="stats">Stats</button>
      <button class="link" data-act="swap">Swap</button>
    </div>
    <div class="swap-area"></div>
  </div>`;
}
function exList(split) {
  if (!split.exercises.length) return `<div class="empty">No targets yet. Log this workout once and they'll show up here.</div>`;
  const inc = split.exercises.filter(e => e.increase);
  const banner = inc.length ? `<div class="banner"><b>Weight goes up today</b>${inc.map(e => `${esc(e.exercise)} → ${fmt(e.weight)} kg`).join("<br>")}</div>` : "";
  return banner + split.exercises.map(exCard).join("");
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const card = btn.closest(".ex");
  const name = card?.dataset.ex;
  if (btn.dataset.act === "stats") { statsWanted = name; go("stats"); }
  if (btn.dataset.act === "swap") {
    const area = $(".swap-area", card);
    if (area.innerHTML) { area.innerHTML = ""; return; }
    area.innerHTML = `<div class="swap"><select aria-label="Swap to">${exercises.filter(x => x !== name).map(x => `<option>${esc(x)}</option>`).join("")}</select><button class="btn" data-act="doswap">Get targets</button></div>`;
  }
  if (btn.dataset.act === "doswap") {
    const area = $(".swap-area", card);
    const to = $("select", area).value;
    btn.disabled = true; btn.textContent = "…";
    try {
      const r = await api("substitute", { from: name, to });
      area.insertAdjacentHTML("beforeend", `<div class="swapped"><div class="eyebrow" style="text-transform:none;letter-spacing:0">Instead: ${esc(r.to)}</div>${targetBlock(r.target)}</div>`);
      $(".swap", area).remove();
    } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = "Get targets"; }
  }
});

/* ---------- Today ---------- */

` + exList(d);

}

/* ---------- Stats ---------- */
let statsWanted = null, statsRange = 20, statsData = null;
async function loadStats() {
  const pick = $("#statsPick");
  if (!pick.options.length) pick.innerHTML = exercises.map(x => `<option>${esc(x)}</option>`).join("");
  if (statsWanted) { pick.value = statsWanted; statsWanted = null; }
  else if (statsData) return;
  const body = $("#statsBody");
  body.innerHTML = '<div class="skel" style="margin-top:14px;height:260px"></div>';
  try { statsData = await api("stats?exercise=" + encodeURIComponent(pick.value)); renderStats(); }
  catch (e) { fail(body, e); }
}
$("#statsPick").addEventListener("change", () => { statsWanted = $("#statsPick").value; loadStats(); });

function renderStats() {
  const d = statsData;
  const ch = d.change > 0 ? "+" + fmt(d.change) : fmt(d.change);
  const momCls = d.momentum === "Strong" ? "up" : d.momentum === "Fading" ? "bad" : "";
  $("#statsBody").innerHTML = `
    <div class="metrics">
      <div class="metric"><span>Best ever</span><b>${fmt(d.best)}</b> kg</div>
      <div class="metric"><span>Change (${d.sessions_analyzed})</span><b>${ch}</b> kg</div>
      <div class="metric"><span>Momentum</span><b class="pill ${momCls}" style="font-size:14px">${esc(d.momentum)}</b></div>
    </div>
    ${d.plateau ? `<div class="banner" style="background:var(--bad-bg);color:var(--bad)"><b>Plateau</b>Same weight for ${d.plateau} sessions.</div>` : ""}
    <div class="chart">
      <div class="chart-head"><span>Top set weight (kg)</span>
        <div class="range">${[10, 20, 0].map(n => `<button data-n="${n}" class="${n === statsRange ? "on" : ""}">${n || "All"}</button>`).join("")}</div>
      </div>
      <div id="chartBox"></div>
    </div>
    <div class="tablewrap">
      <table class="log"><thead><tr><th>Date</th><th>Sets (kg × reps)</th></tr></thead>
      <tbody>${d.sessions.slice(-10).reverse().map(s => `
        <tr><td>${new Date(s.date + "T00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" })}<br><span style="color:var(--faint);font-size:11px">${esc(s.workout)}</span></td>
        <td class="sets">${s.sets.map(([w, r]) => `${fmt(w)}×${r}`).join("&nbsp;&nbsp;")}</td></tr>`).join("")}
      </tbody></table>
    </div>`;
  drawChart();
  document.querySelectorAll(".range button").forEach(b => b.addEventListener("click", () => {
    statsRange = +b.dataset.n;
    document.querySelectorAll(".range button").forEach(x => x.classList.toggle("on", x === b));
    drawChart();
  }));
}

function drawChart() {
  const all = statsData.sessions;
  const pts = statsRange ? all.slice(-statsRange) : all;
  const W = 600, H = 220, L = 38, R = 12, T = 12, B = 26;
  const ys = pts.map(p => p.top);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 4) { lo -= 2; hi += 2; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = i => L + (pts.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const ticks = 4, grid = [];
  for (let k = 0; k <= ticks; k++) {
    const v = lo + (hi - lo) * k / ticks;
    grid.push(`<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${Math.round(v)}</text>`);
  }
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.top).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length - 1)},${H - B}L${x(0)},${H - B}Z`;
  const step = Math.max(1, Math.ceil(pts.length / 5));
  const labels = pts.map((p, i) => (i % step === 0 || i === pts.length - 1) && !(i !== pts.length - 1 && pts.length - 1 - i < step / 2)
    ? `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === pts.length - 1 && pts.length > 1 ? "end" : i === 0 && pts.length > 1 ? "start" : "middle"}" font-size="11" fill="var(--faint)">${new Date(p.date + "T00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" })}</text>` : "").join("");
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.top)}" r="${pts.length > 40 ? 2 : 3.5}" fill="var(--accent)"><title>${p.date}: ${fmt(p.top)} kg</title></circle>`).join("");
  const last = pts[pts.length - 1];
  $("#chartBox").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Top set weight over time">
    ${grid.join("")}
    <path d="${area}" fill="var(--accent)" opacity=".1"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
    <text x="${x(pts.length - 1) - 6}" y="${y(last.top) - 10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--text)">${fmt(last.top)}</text>
  </svg>`;
}

/* ---------- Week ---------- */
function mdLite(text) {
  return text.split("\n").map(line => {
    if (!line.trim()) return '<div class="gap"></div>';
    let h = esc(line)
      .replace(/\*([^*]+)\*/g, "<b>$1</b>")
      .replace(/(^|\s)_([^_]+)_(?=\s|$)/g, "$1<em>$2</em>");
    return `<p>${h}</p>`;
  }).join("");
}
async function loadWeek(force) {
  const el = $("#v-week");
  if (cache.week && !force) return;
  loading(el, 1);
  try { const d = await api("weekly"); cache.week = d; el.innerHTML = `<div class="week">${mdLite(d.text)}</div>`; }
  catch (e) { fail(el, e); }
}

/* ---------- Settings ---------- */
async function loadSettings(force) {
  if (!cache.settings || force) {
    loading($("#setBody"));
    try { cache.settings = await api("settings"); } catch (e) { fail($("#setBody"), e); return; }
  }
  renderSettings();
}
function setRow(s) {
  const f = (key, label, val, step, ph) => `
    <div><label>${label}</label><input type="number" inputmode="decimal" step="${step}" data-key="${key}"
      value="${val ?? ""}" placeholder="${ph}" class="${s.changed.includes(key) ? "changed" : ""}"></div>`;
  return `<div class="setrow" data-ex="${esc(s.exercise)}">
    <div class="setrow-head"><span>${esc(s.exercise)}</span>
      ${s.strict ? '<span class="pill info">Strict</span>' : ""}
      ${s.changed.length ? '<button class="link" data-reset>Reset</button>' : ""}</div>
    <div class="setgrid">
      ${f("ceiling", "Rep ceiling", s.ceiling, 1, "")}
      ${f("step", "Step (kg)", s.step, 0.25, "")}
      ${f("max_weight", "Max (kg)", s.max_weight, 0.5, "none")}
    </div></div>`;
}
function renderSettings() {
  const q = $("#setSearch").value.trim().toLowerCase();
  const rows = cache.settings.filter(s => s.exercise.toLowerCase().includes(q));
  $("#setBody").innerHTML = rows.length ? rows.map(setRow).join("") : '<div class="empty">No exercise matches that.</div>';
}
$("#setSearch").addEventListener("input", () => cache.settings && renderSettings());

async function saveSetting(input) {
  const row = input.closest(".setrow");
  const ex = row.dataset.ex, key = input.dataset.key;
  const old = cache.settings.find(s => s.exercise === ex);
  if (String(old[key] ?? "") === input.value.trim()) return;
  try {
    const upd = await api("settings", { exercise: ex, key, value: input.value.trim() });
    Object.assign(old, upd);
    row.outerHTML = setRow(upd);
    delete cache.today; delete cache.plan;
    toast(`${ex}: saved, updating Hevy`);
  } catch (e) { toast(e.message); input.value = old[key] ?? ""; }
}
$("#setBody").addEventListener("change", e => { if (e.target.matches("input[data-key]")) saveSetting(e.target); });
$("#setBody").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input[data-key]")) e.target.blur(); });
$("#setBody").addEventListener("click", async e => {
  if (!e.target.matches("[data-reset]")) return;
  const row = e.target.closest(".setrow"), ex = row.dataset.ex;
  try {
    const upd = await api("settings/reset", { exercise: ex });
    Object.assign(cache.settings.find(s => s.exercise === ex), upd);
    row.outerHTML = setRow(upd);
    delete cache.today; delete cache.plan;
    toast(`${ex}: back to defaults`);
  } catch (err) { toast(err.message); }
});

/* ---------- Sync / train ---------- */
const tools = $("#tools");
$("#openTools").addEventListener("click", () => tools.classList.add("on"));
$("#closeTools").addEventListener("click", () => tools.classList.remove("on"));
tools.addEventListener("click", e => { if (e.target === tools) tools.classList.remove("on"); });
async function runJob(path, btn, label, body = {}) {
  const log = $("#jobLog");
  document.querySelectorAll(".sheet .btn").forEach(b => b.disabled = true);
  btn.textContent = label + "…";
  log.style.display = "block"; log.textContent = "Working on it. This can take a minute.";
  try {
    const r = await api(path, body);
    log.textContent = r.log;
    Object.keys(cache).forEach(k => delete cache[k]); statsData = null;
    toast("Done");
  } catch (e) { log.textContent = e.message; }
  document.querySelectorAll(".sheet .btn").forEach(b => b.disabled = false);
  $("#doSync").textContent = "Sync from Hevy"; $("#doTrain").textContent = "Retrain models";
  $("#doPreview").textContent = "Preview Hevy changes (writes nothing)";
}
$("#doSync").addEventListener("click", e => runJob("sync", e.target, "Syncing"));

/* ---------- Send to Hevy (the main button) ---------- */
let hevyBusy = false;
function showHevyResult(html) {
  const box = $("#hevyResult"); box.innerHTML = html; box.classList.add("on");
  clearTimeout(showHevyResult._t); showHevyResult._t = setTimeout(() => box.classList.remove("on"), 9000);
}
$("#hevyResult").addEventListener("click", () => $("#hevyResult").classList.remove("on"));
$("#sendHevy").addEventListener("click", async () => {
  if (hevyBusy) return;
  hevyBusy = true;
  const btn = $("#sendHevy"), label = $("#sendHevy span");
  btn.disabled = true; label.textContent = "Sending…";
  try {
    const r = await api("hevy/push", {});
    const warn = (r.warnings || []).map(w => `<p class="warn">⚠️ ${esc(w)}</p>`).join("");
    if (r.updated.length) showHevyResult(`<b>✓ Hevy updated</b><p>${esc(r.updated.join(", "))} now ${r.updated.length > 1 ? "have" : "has"} your new targets. Open Hevy and start the routine.</p>${warn}`);
    else showHevyResult(`<b>✓ Hevy is already up to date</b><p>Your routines already match your targets.</p>${warn}`);
  } catch (e) {
    showHevyResult(`<b>Couldn't update Hevy</b><p class="warn">${esc(e.message)}</p>`);
  }
  btn.disabled = false; label.textContent = "Send to Hevy"; hevyBusy = false;
});
$("#doTrain").addEventListener("click", e => runJob("train", e.target, "Training"));
$("#doPreview").addEventListener("click", e => runJob("hevy/push", e.target, "Checking", { dry_run: true }));

/* ---------- Coach ---------- */
const COACH_KEY = "zr_coach";
let chat = loadJSON(COACH_KEY, []);
let coachEnabled = null, coachBusy = false;
const QUICK = [
  "How did my last workout go?",
  "I'm injured / sore. What should I change?",
  "I need to take a break this week",
  "Why is my shoulder press stuck?",
  "Am I rating my RPE right?",
];

function coachMd(text) {
  // Small, safe markdown: **bold**, *bold*, "- " lists, paragraphs
  const lines = esc(text).split("\n");
  let html = "", inList = false;
  for (const raw of lines) {
    const line = raw.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<b>$2</b>");
    const li = line.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${li[1]}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (line.trim()) html += `<p>${line}</p>`;
  }
  return html + (inList ? "</ul>" : "");
}

async function loadCoach() {
  const el = $("#v-coach");
  if (coachEnabled === null) {
    try { coachEnabled = (await api("coach/status")).enabled; } catch (e) { fail(el, e); return; }
  }
  if (!coachEnabled) {
    el.innerHTML = `<div class="g-card setup"><h4>Set up your coach</h4>
      <p class="reason" style="margin:0">The coach uses Google's Gemini (free tier). One-time setup on the laptop:</p>
      <ol>
        <li>Go to <b>aistudio.google.com/apikey</b>, sign in with Google and click <b>Create API key</b>.</li>
        <li>Open the <code>.env</code> file in the Zero_RIR_Bot folder and add a line:<br><code>GEMINI_API_KEY="paste-your-key"</code></li>
        <li>Close the web app window and run <code>run_web_app.bat</code> again, then come back here.</li>
      </ol>
      <p class="reason" style="margin:0">Your targets, recent sets and settings are sent to Gemini with each question so it can answer about your training.</p></div>`;
    return;
  }
  renderChat();
}

function renderChat() {
  const el = $("#v-coach");
  const msgs = chat.map(m => m.role === "user"
    ? `<div class="msg user">${esc(m.text).replace(/\n/g, "<br>")}</div>`
    : m.role === "err" ? `<div class="msg err">${esc(m.text)}</div>`
    : `<div class="msg model">${coachMd(m.text)}</div>`).join("");
  el.innerHTML = `
    ${chat.length ? "" : `<p class="coach-intro">Ask anything about your training. I can see your targets, your last few sessions of every exercise, your settings and this week's summary.</p>`}
    <div class="chat" id="chatList">${msgs}${coachBusy ? '<div class="typing">Coach is typing…</div>' : ""}</div>
    ${chat.length ? "" : `<div class="chips">${QUICK.map(q => `<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`}
    <form class="composer" id="composer">
      <textarea id="coachInput" rows="1" placeholder="Message your coach" aria-label="Message your coach"></textarea>
      <button class="btn" ${coachBusy ? "disabled" : ""}>Send</button>
    </form>
    ${chat.length ? `<div style="text-align:center"><button class="link" id="clearChat">Clear chat</button></div>` : ""}`;
  const input = $("#coachInput");
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); sendCoach(input.value); } });
  $("#composer").addEventListener("submit", e => { e.preventDefault(); sendCoach(input.value); });
  window.scrollTo(0, document.body.scrollHeight);
}

async function sendCoach(text) {
  text = (text || "").trim();
  if (!text) { toast("Type a message first"); return; }
  if (coachBusy) return;
  chat = chat.filter(m => m.role !== "err");
  chat.push({ role: "user", text });
  coachBusy = true; renderChat();
  try {
    const r = await api("coach", { messages: chat.filter(m => m.role !== "err").slice(-20) });
    chat.push({ role: "model", text: r.reply });
  } catch (e) {
    if (/Gemini API key/.test(e.message)) coachEnabled = false;
    chat.push({ role: "err", text: e.message });
  }
  coachBusy = false;
  saveJSON(COACH_KEY, chat.filter(m => m.role !== "err").slice(-40));
  if (current === "coach") { if (coachEnabled) renderChat(); else loadCoach(); }
}

$("#v-coach").addEventListener("click", e => {
  const chip = e.target.closest("[data-q]");
  if (chip) { sendCoach(chip.dataset.q); return; }
  if (e.target.closest("#clearChat")) { chat = []; saveJSON(COACH_KEY, chat); renderChat(); }
});

try { localStorage.removeItem("zr_gym"); } catch {}

/* ---------- Auto-sync with Hevy ---------- */
let syncing = false;
async function autoSync() {
  if (syncing) return;
  syncing = true;
  const b = $("#refresh"); b.classList.add("spin"); b.title = "Checking Hevy for new workouts…";
  try {
    const r = await api("autosync", {});
    if (r.changed) {
      Object.keys(cache).forEach(k => delete cache[k]); statsData = null;
      load(current, true);
      toast("New workout synced from Hevy");
    }
  } catch {}
  b.classList.remove("spin"); b.title = ""; syncing = false;
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") autoSync(); });

/* ---------- Start ---------- */
async function boot() {
  try { exercises = await api("exercises"); }
  catch (e) { if (e.message !== "PIN needed") fail($("#v-today"), e); return; }
  const v = store.get("zr_view");
  go(TITLES[v] ? v : "today");
  autoSync();
}
boot();
